<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1a2332" />
  <title>Тренировка к тестам</title>
  <style>
    :root {
      --bg: #121820;
      --card: #1c2533;
      --card2: #243044;
      --text: #eef2f7;
      --muted: #9aa8bc;
      --accent: #3d9cf0;
      --ok: #2fbe7a;
      --bad: #e35d6a;
      --warn: #e6b84d;
      --radius: 14px;
      --pad: 16px;
      --safe-b: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      line-height: 1.45;
      -webkit-tap-highlight-color: transparent;
    }

    .wrap {
      max-width: 560px;
      margin: 0 auto;
      padding: 12px var(--pad) calc(24px + var(--safe-b));
    }

    h1 {
      font-size: 1.35rem;
      margin: 8px 0 4px;
      font-weight: 700;
    }
    .sub {
      color: var(--muted);
      font-size: 0.92rem;
      margin: 0 0 18px;
    }

    .quiz-list { display: grid; gap: 10px; }
    .quiz-btn {
      display: block;
      width: 100%;
      text-align: left;
      background: var(--card);
      border: 1px solid #2d3b50;
      color: var(--text);
      border-radius: var(--radius);
      padding: 14px 16px;
      font-size: 1rem;
      cursor: pointer;
    }
    .quiz-btn:active { transform: scale(0.99); }
    .quiz-btn .meta {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 0.85rem;
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      position: sticky;
      top: 0;
      z-index: 5;
      background: color-mix(in srgb, var(--bg) 92%, transparent);
      backdrop-filter: blur(8px);
      padding: 8px 0;
    }
    .back {
      border: 0;
      background: var(--card2);
      color: var(--text);
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 0.9rem;
      cursor: pointer;
      white-space: nowrap;
    }
    .progress {
      flex: 1;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .score-pill {
      background: var(--card2);
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 0.85rem;
      white-space: nowrap;
    }

    .q-card {
      background: var(--card);
      border: 1px solid #2d3b50;
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 12px;
    }
    .q-type {
      display: inline-block;
      font-size: 0.75rem;
      color: var(--accent);
      background: rgba(61, 156, 240, 0.12);
      border-radius: 999px;
      padding: 3px 8px;
      margin-bottom: 10px;
    }
    .q-text {
      font-size: 1.05rem;
      white-space: pre-wrap;
      margin: 0 0 14px;
      font-weight: 600;
    }

    .choices { display: grid; gap: 8px; }
    .choice {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      width: 100%;
      text-align: left;
      background: var(--card2);
      border: 2px solid transparent;
      color: var(--text);
      border-radius: 12px;
      padding: 12px;
      font-size: 0.98rem;
      cursor: pointer;
    }
    .choice.selected { border-color: var(--accent); background: rgba(61,156,240,0.12); }
    .choice.correct { border-color: var(--ok); background: rgba(47,190,122,0.15); }
    .choice.wrong { border-color: var(--bad); background: rgba(227,93,106,0.15); }
    .choice:disabled { cursor: default; opacity: 1; }
    .mark {
      flex: 0 0 auto;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid #6b7c93;
      margin-top: 1px;
    }
    .choice.selected .mark { border-color: var(--accent); background: var(--accent); }
    .multi .mark { border-radius: 5px; }

    .typein input, .match-row select {
      width: 100%;
      background: var(--card2);
      border: 1px solid #3a4d66;
      color: var(--text);
      border-radius: 10px;
      padding: 12px;
      font-size: 1rem;
    }
    .match-row {
      display: grid;
      gap: 6px;
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid #2d3b50;
    }
    .match-row:last-child { border-bottom: 0; margin-bottom: 0; padding-bottom: 0; }
    .match-left { font-weight: 600; font-size: 0.95rem; }

    .seq-list { display: grid; gap: 8px; }
    .seq-item {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--card2);
      border-radius: 12px;
      padding: 10px;
    }
    .seq-item span { flex: 1; font-size: 0.95rem; }
    .seq-btns { display: flex; flex-direction: column; gap: 4px; }
    .seq-btns button {
      border: 0;
      background: #334560;
      color: var(--text);
      border-radius: 8px;
      width: 36px;
      height: 28px;
      cursor: pointer;
    }

    .actions {
      display: grid;
      gap: 8px;
      margin-top: 14px;
    }
    .btn {
      border: 0;
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 1rem;
      font-weight: 650;
      cursor: pointer;
    }
    .btn-primary { background: var(--accent); color: #041018; }
    .btn-primary:disabled { opacity: 0.45; cursor: default; }
    .btn-ghost { background: var(--card2); color: var(--text); }

    .feedback {
      margin-top: 14px;
      border-radius: var(--radius);
      padding: 14px;
      border: 1px solid transparent;
    }
    .feedback.ok {
      background: rgba(47,190,122,0.12);
      border-color: rgba(47,190,122,0.45);
    }
    .feedback.bad {
      background: rgba(227,93,106,0.12);
      border-color: rgba(227,93,106,0.45);
    }
    .feedback h3 {
      margin: 0 0 8px;
      font-size: 1rem;
    }
    .feedback .correct-block {
      margin: 8px 0;
      padding: 10px;
      background: rgba(0,0,0,0.22);
      border-radius: 10px;
      font-size: 0.95rem;
    }
    .feedback .hint {
      margin-top: 10px;
      padding: 10px;
      background: rgba(230,184,77,0.12);
      border: 1px solid rgba(230,184,77,0.35);
      border-radius: 10px;
      color: #f3e0a8;
      font-size: 0.95rem;
    }
    .feedback .hint b { color: var(--warn); }

    .result {
      text-align: center;
      padding: 28px 10px;
    }
    .result .big {
      font-size: 2.4rem;
      font-weight: 800;
      margin: 8px 0;
    }
    .hidden { display: none !important; }

    .mode-row {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .chip {
      border: 1px solid #3a4d66;
      background: transparent;
      color: var(--muted);
      border-radius: 999px;
      padding: 7px 12px;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .chip.on {
      background: rgba(61,156,240,0.15);
      border-color: var(--accent);
      color: var(--text);
    }
  </style>

        .replace(/"/g, "&quot;");

      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];

      const realIndex = state.order[state.qi];
      return quiz.questions[realIndex];
    }

    function startQuiz(idx) {
      const quiz = window.QUIZZES[idx];
      const order = quiz.questions.map((_, i) => i);
      state.view = "quiz";
      state.quizIndex = idx;
      state.qi = 0;
      state.correctCount = 0;
      state.answered = false;
      state.lastOk = null;
      state.order = state.shuffle ? shuffle(order) : order;
      prepareQuestion();
      render();
      window.scrollTo(0, 0);
    }

    function prepareQuestion() {
      const q = currentQ();
      state.answered = false;
      state.lastOk = null;
      state.selected = new Set();
      state.typein = "";
      if (q.type === "matching") {
        state.matchPicks = q.left.map(() => "");
        state._rightOpts = shuffle(q.right.slice());
      }
      if (q.type === "sequence") {
        state.seqOrder = shuffle(q.items.map((_, i) => i));
      }
      if (q.type === "single" || q.type === "multi") {
        // keep choice order as in source (often intentional), but shuffle for practice
        state._choiceOrder = state.shuffle
          ? shuffle(q.choices.map((_, i) => i))
          : q.choices.map((_, i) => i);
      }
    }

    function arraysEqual(a, b) {
      if (a.length !== b.length) return false;
      for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) return false;
      return true;
    }

    function normalizeTypeIn(s) {
      return String(s || "")
        .trim()
        .toLowerCase()
        .replace(/\s+/g, "")
        .replace(/[−–—]/g, "-")
        .replace(/[«»"']/g, "");
    }

    function checkAnswer() {
      const q = currentQ();
      let ok = false;
      let correctText = "";

      if (q.type === "single") {
        const pick = [...state.selected][0];
        ok = q.correct.length === 1 && pick === q.correct[0];
        correctText = q.correct.map((i) => q.choices[i]).join("; ");
      } else if (q.type === "multi") {
        const picked = [...state.selected].sort((a, b) => a - b);
        const need = q.correct.slice().sort((a, b) => a - b);
        ok = arraysEqual(picked, need);
        correctText = q.correct.map((i) => q.choices[i]).join("; ");
      } else if (q.type === "typein") {
        const val = normalizeTypeIn(state.typein);
        ok = q.answers.some((a) => normalizeTypeIn(a) === val);
        correctText = q.answers.join(" / ");
      } else if (q.type === "matching") {
        ok = q.left.every((left, i) => {
          const pair = q.pairs.find((p) => p[0] === left);
          return pair && state.matchPicks[i] === pair[1];
        });
        correctText = q.pairs.map(([a, b]) => `${a} → ${b}`).join("\n");
      } else if (q.type === "sequence") {
        ok = arraysEqual(state.seqOrder, q.items.map((_, i) => i));
        correctText = q.items.map((t, i) => `${i + 1}. ${t}`).join("\n");
      }

      state.answered = true;
      state.lastOk = ok;
      state._correctText = correctText;
      if (ok) state.correctCount += 1;
      render();
      // scroll feedback into view on phone
      setTimeout(() => {
        const fb = document.getElementById("feedback");
        if (fb) fb.scrollIntoView({ behavior: "smooth", block: "nearest" });
      }, 50);
    }

    function nextQuestion() {
      if (state.qi + 1 >= state.order.length) {
        state.view = "result";
        render();
        return;
      }
      state.qi += 1;
      prepareQuestion();
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function canSubmit() {
      const q = currentQ();
      if (q.type === "single") return state.selected.size === 1;
      if (q.type === "multi") return state.selected.size >= 1;
      if (q.type === "typein") return state.typein.trim().length > 0;
      if (q.type === "matching") return state.matchPicks.every((x) => x);
      if (q.type === "sequence") return true;
      return false;
    }

    function renderHome() {
      const recovered = window.QUIZZES.reduce((s, q) => s + (q.recoveredImageQuestions || 0), 0);
      const skipEl = recovered
        ? `<p class="sub">У ${recovered} вопросов код был на картинке — восстановила по правильным ответам, можно учить.</p>`
        : "";
      const list = window.QUIZZES.map((q, i) => `
        <button class="quiz-btn" data-start="${i}">
          ${esc(q.title)}
          <span class="meta">${q.questions.length} вопросов · ${esc(q.fullTitle)}</span>
        </button>
      `).join("");

      return `
        <h1>Тренировка к тестам</h1>
        <p class="sub">7 тестов. Ошибся — внизу плашка с правильным ответом и как запомнить.</p>
        <p class="sub" id="skippedNote"></p>
        <div class="mode-row">
          <button class="chip ${state.shuffle ? "on" : ""}" id="shuffleChip">Перемешать вопросы</button>
        </div>
        ${skipEl}<div class="quiz-list">${list}</div>
      `;
    }

    function renderChoices(q) {
      const order = state._choiceOrder || q.choices.map((_, i) => i);
      const isMulti = q.type === "multi";
      return `
        <div class="choices ${isMulti ? "multi" : ""}">
          ${order.map((idx) => {
            const selected = state.selected.has(idx);
            let cls = "choice" + (selected ? " selected" : "");
            if (state.answered) {
              if (q.correct.includes(idx)) cls += " correct";
              else if (selected) cls += " wrong";
            }
            return `
              <button class="${cls}" data-choice="${idx}" ${state.answered ? "disabled" : ""}>
                <span class="mark"></span>
                <span>${esc(q.choices[idx])}</span>
              </button>
            `;
          }).join("")}
        </div>
        ${isMulti && !state.answered ? `<p class="sub" style="margin:10px 0 0">Можно выбрать несколько вариантов.</p>` : ""}
      `;
    }

    function renderTypeIn() {
      return `
        <div class="typein">
          <input id="typeinInput" type="text" autocomplete="off" autocorrect="off" autocapitalize="off"
            placeholder="Введи ответ…" value="${esc(state.typein)}" ${state.answered ? "disabled" : ""} />
        </div>
      `;
    }

    function renderMatching(q) {
      const opts = state._rightOpts || q.right;
      return q.left.map((left, i) => `
        <div class="match-row">
          <div class="match-left">${esc(left)}</div>
          <select data-match="${i}" ${state.answered ? "disabled" : ""}>
            <option value="">— выбери —</option>
            ${opts.map((r) => `<option value="${esc(r)}" ${state.matchPicks[i] === r ? "selected" : ""}>${esc(r)}</option>`).join("")}
          </select>
        </div>
      `).join("");
    }

    function renderSequence(q) {
      return `
        <div class="seq-list">
          ${state.seqOrder.map((itemIdx, pos) => `
            <div class="seq-item">
              <strong>${pos + 1}.</strong>
              <span>${esc(q.items[itemIdx])}</span>
              ${state.answered ? "" : `
                <div class="seq-btns">
                  <button data-seq-up="${pos}" ${pos === 0 ? "disabled" : ""}>▲</button>
                  <button data-seq-down="${pos}" ${pos === state.seqOrder.length - 1 ? "disabled" : ""}>▼</button>
                </div>
              `}
            </div>
          `).join("")}
        </div>
        ${!state.answered ? `<p class="sub" style="margin:10px 0 0">Расставь кнопками ▲▼ в правильный порядок.</p>` : ""}
      `;
    }

    function renderFeedback(q) {
      if (!state.answered) return "";
      if (state.lastOk) {
        return `
          <div class="feedback ok" id="feedback">
            <h3>✓ Верно</h3>
            <div class="hint"><b>Как запомнить:</b> ${esc(q.hint)}</div>
          </div>
        `;
      }
      return `
        <div class="feedback bad" id="feedback">
          <h3>✗ Неверно</h3>
          <div class="correct-block"><b>Правильно:</b><br>${esc(state._correctText).replace(/\n/g, "<br>")}</div>
          <div class="hint"><b>Как запомнить:</b> ${esc(q.hint)}</div>
        </div>
      `;
    }

    function renderQuiz() {
      const quiz = currentQuiz();
      const q = currentQ();
      const total = state.order.length;
      let body = "";
      if (q.type === "single" || q.type === "multi") body = renderChoices(q);
      else if (q.type === "typein") body = renderTypeIn();
      else if (q.type === "matching") body = renderMatching(q);
      else if (q.type === "sequence") body = renderSequence(q);

      return `
        <div class="topbar">
          <button class="back" id="toHome">← Тесты</button>
          <div class="progress">${state.qi + 1} / ${total}</div>
          <div class="score-pill">${state.correctCount} верно</div>
        </div>
        <div class="sub" style="margin-top:0">${esc(quiz.title)}</div>
        <div class="q-card">
          <div class="q-type">${TYPE_LABEL[q.type] || q.type}</div>
          <p class="q-text">${esc(q.question)}</p>
          ${body}
          ${renderFeedback(q)}
          <div class="actions">
            ${state.answered
              ? `<button class="btn btn-primary" id="nextBtn">${state.qi + 1 >= total ? "Итог" : "Дальше"}</button>`
              : `<button class="btn btn-primary" id="checkBtn" ${canSubmit() ? "" : "disabled"}>Проверить</button>`
            }
          </div>
        </div>
      `;
    }

    function renderResult() {
      const quiz = currentQuiz();
      const total = state.order.length;
      const pct = Math.round((state.correctCount / total) * 100);
      return `
        <div class="result">
          <div class="sub">${esc(quiz.title)}</div>
          <div class="big">${pct}%</div>
          <p>${state.correctCount} из ${total} верно</p>
          <div class="actions" style="max-width:320px;margin:20px auto 0">
            <button class="btn btn-primary" id="retryBtn">Ещё раз</button>
            <button class="btn btn-ghost" id="homeBtn">К списку тестов</button>
          </div>
        </div>
      `;
    }

    function render() {
      const app = document.getElementById("app");
      if (state.view === "home") app.innerHTML = renderHome();
      else if (state.view === "quiz") app.innerHTML = renderQuiz();
      else if (state.view === "result") app.innerHTML = renderResult();
      bind();
    }

    function bind() {
      document.querySelectorAll("[data-start]").forEach((el) => {
        el.addEventListener("click", () => startQuiz(+el.dataset.start));
      });
      const shuffleChip = document.getElementById("shuffleChip");
      if (shuffleChip) {
        shuffleChip.addEventListener("click", () => {
          state.shuffle = !state.shuffle;
          render();
        });
      }
      const toHome = document.getElementById("toHome");
      if (toHome) toHome.addEventListener("click", () => { state.view = "home"; render(); });
      const homeBtn = document.getElementById("homeBtn");
      if (homeBtn) homeBtn.addEventListener("click", () => { state.view = "home"; render(); });
      const retryBtn = document.getElementById("retryBtn");
      if (retryBtn) retryBtn.addEventListener("click", () => startQuiz(state.quizIndex));

      document.querySelectorAll("[data-choice]").forEach((el) => {
        el.addEventListener("click", () => {
          if (state.answered) return;
          const idx = +el.dataset.choice;
          const q = currentQ();
          if (q.type === "single") {
            state.selected = new Set([idx]);
          } else {
            if (state.selected.has(idx)) state.selected.delete(idx);
            else state.selected.add(idx);
          }
          render();
        });
      });

      const typein = document.getElementById("typeinInput");
      if (typein) {
        typein.addEventListener("input", (e) => {
          state.typein = e.target.value;
          const btn = document.getElementById("checkBtn");
          if (btn) btn.disabled = !canSubmit();
        });
        typein.addEventListener("keydown", (e) => {
          if (e.key === "Enter" && canSubmit() && !state.answered) checkAnswer();
        });
      }

      document.querySelectorAll("[data-match]").forEach((el) => {
        el.addEventListener("change", (e) => {
          state.matchPicks[+el.dataset.match] = e.target.value;
          const btn = document.getElementById("checkBtn");
          if (btn) btn.disabled = !canSubmit();
        });
      });

      document.querySelectorAll("[data-seq-up]").forEach((el) => {
        el.addEventListener("click", () => {
          const i = +el.dataset.seqUp;
          if (i <= 0) return;
          [state.seqOrder[i - 1], state.seqOrder[i]] = [state.seqOrder[i], state.seqOrder[i - 1]];
          render();
        });
      });
      document.querySelectorAll("[data-seq-down]").forEach((el) => {
        el.addEventListener("click", () => {
          const i = +el.dataset.seqDown;
          if (i >= state.seqOrder.length - 1) return;
          [state.seqOrder[i + 1], state.seqOrder[i]] = [state.seqOrder[i], state.seqOrder[i + 1]];
          render();
        });
      });

      const checkBtn = document.getElementById("checkBtn");
      if (checkBtn) checkBtn.addEventListener("click", () => { if (canSubmit()) checkAnswer(); });
      const nextBtn = document.getElementById("nextBtn");
      if (nextBtn) nextBtn.addEventListener("click", nextQuestion);
    }

    if (!window.QUIZZES) {
      document.getElementById("app").innerHTML = "<p>Не загрузился quizzes.js</p>";
    } else {
      render();
    }
  </script>
</body>
</html>
